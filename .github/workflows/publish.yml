name: Publish

env:
  module_id: discordrichpresence

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: "Version to release (v will be added to the tag)"
        required: true
      release_msg:
        description: "Message for release"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        name: Checkout
        with:
          submodules: true
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android helper toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Discord RPC helper
        shell: pwsh
        run: ./scripts/build-discord-rpc-helper.ps1

      - name: Test MBF manifest injector
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Setup QPM
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          resolve_ndk: true
          cache: true

      - name: Build & Create QMOD
        run: |
          cd ${GITHUB_WORKSPACE}
          qpm qmod zip
          python3 scripts/inject_mbf_manifest_requirements.py DiscordRichPresence.qmod

      - name: Get Output Names
        id: names
        run: |
          qmod_files=( "*.qmod" )
          echo "QMOD=${qmod_files[0]}" >> ${GITHUB_OUTPUT}

          cd build

          lib_files=( "lib${module_id}*.so" )
          echo "LIB=${lib_files[0]}" >> ${GITHUB_OUTPUT}

          cd debug
          mv ${lib_files[0]} debug_${lib_files[0]}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.release_msg }}
          tag_name: "v${{ github.event.inputs.release_ver }}"
          files: |
            build/${{ steps.names.outputs.LIB }}
            build/debug/debug_${{ steps.names.outputs.LIB }}
            ${{ steps.names.outputs.QMOD }}
